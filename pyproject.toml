[tool.poetry]
name = "birdbot"
version = "3.0.0"
description = "The fully featured official discord bot for the kurzgesagt server"
readme = "README.md"
authors = []

[tool.poetry.dependencies]
python = "^3.11"
discord-py = "^2.4.0"
pymongo = "^4.10.1"
python-dotenv = "^1.0.1"
rich = "^13.9.4"
certifi = "^2024.8.30"
demoji = "^1.1.0"
numpy = "^2.1.3"
fuzzywuzzy = "^0.18.0"
requests = "^2.32.3"


[tool.poetry.group.dev.dependencies]
pyright = "^1.1.389"
ruff = "^0.8.2"

[tool.pyright]
pythonVersion = "3.11"  
useLibraryCodeForTypes = true
reportUnusedImport = "error"
typeCheckingMode = "basic"
include=[
    'app',
    'startbot.py'
]
exclude=[
    "**/node_modules",
    "**/__pycache__",
    ".venv" # Replace with your venv name
]
ignore=[
    'app/cogs/automod.py'
]


[tool.ruff]
src = ["app"]
extend-exclude = ["app/cogs/automod.py"]

line-length = 120
show-fixes = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
# For reference to selected rules: https://docs.astral.sh/ruff/rules/
select = [
    "ANN", "B", "C4", "D", "DTZ", "E", "F", "I", "ISC", "INT", "LOG", "N", 
    "PGH", "PIE", "Q", "RET", "RSE", "RUF", "S", "SIM", "T20", "TID", "UP", "W"
]

ignore = [
    "ANN401", 
    "D104", "D107", "D203", "D213",
    "ISC001",
    "N818",
    "RUF006"
]
extend-select = ["I001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
order-by-type = true
case-sensitive = true
